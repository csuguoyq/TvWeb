plugins {
    alias(libs.plugins.android.application)
}

ext { // 定义当前gradle文件的全局变量
    releaseVersionName = "1.0.2"
    releaseVersionCode = 2
}

android {
    namespace 'com.qiko.tvweb'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.qiko.tvweb"
        minSdk 24
        targetSdk 36
        versionCode releaseVersionCode
        versionName releaseVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "armeabi", "armeabi-v7a", "arm64-v8a", "x86"
        }
    }

    android.applicationVariants.all {
        variant ->
            variant.outputs.all {
                //这里修改apk文件名
                outputFileName = "Qiko_WebTV_v${variant.versionName}${new Date().format('MMddHHmm')}.apk"
            }
    }

    signingConfigs {
        heysharekey {
            storeFile file('../qiko_key.jks')
            keyAlias 'qiko_key'
            keyPassword 'qiko123'
            storePassword 'qiko123'
        }
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
        release {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            signingConfig signingConfigs.heysharekey
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.heysharekey
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    viewBinding {
        enabled = true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}